name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Install Android SDK + NDK
        run: |
          set -e
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          if [ -f "${NDK_DIR}/source.properties" ]; then
            echo "NDK ${NDK_VERSION} already present — skip download"
          else
            for attempt in 1 2 3 4 5; do
              rm -rf "${ANDROID_HOME}/ndk/${NDK_VERSION}" 2>/dev/null || true
              if "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;${NDK_VERSION}"; then
                break
              fi
              echo "sdkmanager failed (attempt ${attempt}/5), retrying in 20s..."
              sleep 20
              if [ "$attempt" -eq 5 ]; then
                echo "NDK install failed after 5 attempts"
                exit 1
              fi
            done
          fi
          test -f "${NDK_DIR}/source.properties"

      - run: chmod +x gradlew

      - name: Fetch Gradle wrapper (retry)
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle wrapper fetch failed (attempt ${attempt}/5), waiting..."
            sleep 30
          done
          exit 1

      - name: Build release APK
        run: |
          set -e
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --stacktrace --no-daemon; then
              exit 0
            fi
            echo "assembleRelease failed (attempt ${attempt}/3), retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Verify application APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "${ANDROID_HOME}/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -q "package: name='com.xorel.codm.external'"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libCodmEsp\.so'
          echo "OK: codm-external release APK"

      - uses: actions/upload-artifact@v4
        with:
          name: codm-external-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
